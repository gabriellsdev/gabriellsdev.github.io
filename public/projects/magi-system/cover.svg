<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="magiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180507"/>
      <stop offset="100%" stop-color="#080203"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#magiBg)"/>

  <!-- Hazard CRT Scanlines -->
  <line x1="0" y1="20" x2="600" y2="20" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Hexagonal supercomputer grid -->
  <!-- Melchior-1 -->
  <polygon points="150,115 200,85 250,115 250,175 200,205 150,175" fill="#2d080c" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="135" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MELCHIOR-1</text>
  <text x="200" y="152" fill="#ef4444" font-family="monospace" font-size="10" text-anchor="middle">SCIENTIST</text>
  <text x="200" y="170" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">RESOLVED</text>

  <!-- Balthasar-2 -->
  <polygon points="350,115 400,85 450,115 450,175 400,205 350,175" fill="#2d080c" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="135" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BALTHASAR-2</text>
  <text x="400" y="152" fill="#ef4444" font-family="monospace" font-size="10" text-anchor="middle">MOTHER</text>
  <text x="400" y="170" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">RESOLVED</text>

  <!-- Casper-3 -->
  <polygon points="250,215 300,185 350,215 350,275 300,305 250,275" fill="#2d080c" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="235" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CASPER-3</text>
  <text x="300" y="252" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">WOMAN</text>
  <text x="300" y="270" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">CONSENSUS</text>

  <!-- Connectors -->
  <line x1="250" y1="145" x2="350" y2="145" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="225" y1="190" x2="275" y2="220" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="375" y1="190" x2="325" y2="220" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Classification Bar -->
  <rect x="50" y="32" width="500" height="28" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="65" y="51" fill="#fee2e2" font-family="monospace" font-size="11" font-weight="bold">MAGI SYSTEM V4.6 · NERV-01 DELIBERATION ENGINE [ONLINE NA VERCEL]</text>

  <!-- Technical Readout bottom -->
  <rect x="180" y="318" width="240" height="28" rx="4" fill="#000000" stroke="#f59e0b" stroke-width="1"/>
  <text x="300" y="337" fill="#fde68a" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">DEMO: magi-six.vercel.app</text>
</svg>
