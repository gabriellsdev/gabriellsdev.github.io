<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a1c"/>
      <stop offset="100%" stop-color="#020c0e"/>
    </linearGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#luminaBg)"/>

  <!-- Subtle calming concentric circles (Mental health / focus) -->
  <circle cx="300" cy="180" r="160" fill="none" stroke="#0891b2" stroke-width="0.8" opacity="0.2"/>
  <circle cx="300" cy="180" r="120" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="180" r="80" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.4"/>

  <!-- Phone mockup frame -->
  <rect x="210" y="35" width="180" height="290" rx="24" fill="#0b171c" stroke="#164e63" stroke-width="2"/>
  <!-- Notch -->
  <rect x="260" y="44" width="80" height="12" rx="6" fill="#040b0e"/>

  <!-- Top bar in phone -->
  <text x="300" y="80" fill="#22d3ee" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">LUMINA CARE</text>
  <text x="300" y="96" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Psicólogo Conectado</text>

  <!-- Video call / session badge -->
  <rect x="228" y="112" width="144" height="64" rx="10" fill="#083344" stroke="#0e7490" stroke-width="1"/>
  <circle cx="250" cy="144" r="12" fill="#0284c7"/>
  <text x="250" y="148" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">👤</text>
  <text x="270" y="138" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="600">Sessão Virtual</text>
  <text x="270" y="152" fill="#38bdf8" font-family="sans-serif" font-size="8">Vídeo HD · Criptografia</text>

  <!-- Chat / scheduling indicator -->
  <rect x="228" y="188" width="144" height="42" rx="8" fill="#0f292e" stroke="#134e4a" stroke-width="0.8"/>
  <text x="240" y="206" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="600">Prontuário &amp; Agenda</text>
  <text x="240" y="220" fill="#99f6e4" font-family="monospace" font-size="8">Sincronizado via Supabase</text>

  <!-- Navigation indicator -->
  <rect x="270" y="310" width="60" height="4" rx="2" fill="#64748b"/>

  <!-- External floating badge left -->
  <rect x="50" y="130" width="135" height="50" rx="8" fill="#082f38" stroke="#0891b2" stroke-width="1"/>
  <text x="117" y="152" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Startup PUCPR</text>
  <text x="117" y="168" fill="#a5f3fc" font-family="monospace" font-size="9" text-anchor="middle">Saúde Mental Mobile</text>

  <!-- External floating badge right -->
  <rect x="415" y="130" width="140" height="50" rx="8" fill="#082f38" stroke="#0d9488" stroke-width="1"/>
  <text x="485" y="152" fill="#5eead4" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">React Native + Expo</text>
  <text x="485" y="168" fill="#99f6e4" font-family="monospace" font-size="9" text-anchor="middle">Supabase Auth &amp; DB</text>
</svg>
