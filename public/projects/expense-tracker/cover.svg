<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#finBg)"/>

  <!-- Mobile phone mockup center left -->
  <rect x="220" y="30" width="160" height="295" rx="22" fill="#130e24" stroke="#4c1d95" stroke-width="2"/>
  <rect x="260" y="40" width="80" height="10" rx="5" fill="#07040d"/>

  <!-- Phone content -->
  <text x="300" y="74" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CREDO FINANCE</text>
  <text x="300" y="90" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">React Native + Supabase</text>

  <!-- Metric widget -->
  <rect x="236" y="104" width="128" height="52" rx="8" fill="#1f153a" stroke="#6d28d9" stroke-width="0.8"/>
  <text x="248" y="122" fill="#a78bfa" font-family="sans-serif" font-size="8">SALDO CONCILIADO</text>
  <text x="248" y="144" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">R$ 14.850,00</text>

  <!-- Transaction item 1 -->
  <rect x="236" y="165" width="128" height="32" rx="6" fill="#18102e"/>
  <text x="246" y="184" fill="#e2e8f0" font-family="sans-serif" font-size="9">Servidor Cloud</text>
  <text x="354" y="184" fill="#f87171" font-family="monospace" font-size="9" text-anchor="end">-R$ 180</text>

  <!-- Transaction item 2 -->
  <rect x="236" y="202" width="128" height="32" rx="6" fill="#18102e"/>
  <text x="246" y="221" fill="#e2e8f0" font-family="sans-serif" font-size="9">Receita Mensal</text>
  <text x="354" y="221" fill="#34d399" font-family="monospace" font-size="9" text-anchor="end">+R$ 3.200</text>

  <!-- Quick action button in phone -->
  <rect x="246" y="246" width="108" height="28" rx="14" fill="#7c3aed"/>
  <text x="300" y="264" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">+ Nova Operação</text>

  <!-- Floating feature badges -->
  <rect x="42" y="130" width="150" height="52" rx="8" fill="#1c1236" stroke="#8b5cf6" stroke-width="1"/>
  <text x="117" y="152" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Controle de Gastos</text>
  <text x="117" y="168" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">Categorização &amp; Lembretes</text>

  <rect x="408" y="130" width="150" height="52" rx="8" fill="#1c1236" stroke="#8b5cf6" stroke-width="1"/>
  <text x="483" y="152" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Stack Mobile</text>
  <text x="483" y="168" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">Expo · Supabase · PostgreSQL</text>

  <!-- Bottom tag -->
  <rect x="150" y="318" width="300" height="26" rx="4" fill="#000000" stroke="#a855f7" stroke-width="0.8"/>
  <text x="300" y="335" fill="#f3e8ff" font-family="monospace" font-size="10" text-anchor="middle">GITHUB: github.com/gabriellsdev/ExpenseTracker</text>
</svg>
