<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="nfseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#nfseBg)"/>
  
  <!-- Subtle technical grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Glow dot -->
  <circle cx="500" cy="80" r="120" fill="#14b8a6" opacity="0.08"/>

  <!-- Card mockup -->
  <rect x="50" y="45" width="500" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="500" height="38" rx="12" fill="#1e293b"/>
  <circle cx="75" cy="64" r="5" fill="#ef4444"/>
  <circle cx="92" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="109" cy="64" r="5" fill="#10b981"/>
  <text x="300" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="600">NFS-e Nacional Suite — ADN Batch Processor</text>

  <!-- Content elements -->
  <rect x="80" y="105" width="200" height="65" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
  <text x="96" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">CERTIFICADO DIGITAL</text>
  <text x="96" y="152" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">A1 / A3 CONECTADO</text>

  <rect x="300" y="105" width="220" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="316" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">COLETA ADN EM LOTE</text>
  <text x="316" y="152" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">2.450 XMLs PROCESSADOS</text>

  <!-- Progress bar -->
  <rect x="80" y="195" width="440" height="10" rx="5" fill="#1e293b"/>
  <rect x="80" y="195" width="360" height="10" rx="5" fill="url(#tealGrad)"/>

  <!-- Danfse & Excel Badges -->
  <rect x="80" y="230" width="130" height="45" rx="6" fill="#132338" stroke="#14b8a6" stroke-width="0.8"/>
  <text x="145" y="258" fill="#5eead4" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DANFSe em Lote</text>

  <rect x="230" y="230" width="140" height="45" rx="6" fill="#132a22" stroke="#10b981" stroke-width="0.8"/>
  <text x="300" y="258" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Planilhas Excel</text>

  <rect x="390" y="230" width="130" height="45" rx="6" fill="#2d1b33" stroke="#a855f7" stroke-width="0.8"/>
  <text x="455" y="258" fill="#d8b4fe" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">B2B Produção</text>
</svg>
