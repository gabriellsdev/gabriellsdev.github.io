<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="gardenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d13"/>
      <stop offset="100%" stop-color="#040b07"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#gardenBg)"/>

  <!-- Botanical foliage / geometric CSS garden curves -->
  <circle cx="120" cy="180" r="140" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
  <circle cx="480" cy="180" r="140" fill="none" stroke="#86efac" stroke-width="1" opacity="0.2"/>
  
  <!-- Stylized central plant leaf -->
  <path d="M300,60 C360,110 380,200 300,260 C220,200 240,110 300,60 Z" fill="url(#leafGrad)" opacity="0.85"/>
  <path d="M300,60 L300,260" stroke="#052e16" stroke-width="2"/>
  <path d="M300,120 Q330,140 350,150" stroke="#052e16" stroke-width="1.5" fill="none"/>
  <path d="M300,160 Q270,180 250,190" stroke="#052e16" stroke-width="1.5" fill="none"/>
  <path d="M300,200 Q330,220 345,230" stroke="#052e16" stroke-width="1.5" fill="none"/>

  <rect x="180" y="275" width="240" height="42" rx="21" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="300" y="302" fill="#ecfdf5" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">JARDIM WEB · CSS</text>
  
  <text x="300" y="340" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.8">100% CSS PURO · CSS ZEN GARDEN PHILOSOPHY</text>
</svg>
